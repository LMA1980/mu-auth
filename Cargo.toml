[package]
name = "mu-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/LMA1980/mu-auth"
authors = ["LMA1980"]
description = "Reusable no_std+alloc authorization core: subsystem policies, composable PolicyFolios, RoleFolioIndex, independent RoleLeases, and optional github-oauth / 1Password & FIDO2 WebAuthn adapters"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
readme = "README.md"

[features]
default = []
std = ["serde/std", "serde_json?/std"]
github-oauth = [
  "std",
  "dep:hex",
  "dep:hmac",
  "dep:serde_json",
  "dep:sha2",
  "dep:subtle",
  "dep:url",
  "dep:webauthn-rs-core",
]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
url = { version = "2.5", optional = true }
webauthn-rs-core = { version = "0.6", optional = true }
